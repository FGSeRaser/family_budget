# Prüft den Code und baut die APK automatisch bei jedem Hochladen.
# von FGSeRaser (https://github.com/FGSeRaser)
#
# Für die fertige APK zwei Secrets anlegen (Repo -> Settings -> Secrets and variables -> Actions):
#   GOOGLE_SERVICES_JSON   = Inhalt von android/app/google-services.json als Base64
#   FIREBASE_OPTIONS_DART  = Inhalt von lib/firebase_options.dart als Base64
# Ohne Secrets wird nur geprüft (analyze + test), aber keine APK gebaut.
name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Firebase-Dateien einsetzen
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 -d > lib/firebase_options.dart
          else
            cp ci/firebase_options_stub.dart lib/firebase_options.dart
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "HAS_FIREBASE=true" >> "$GITHUB_ENV"
          fi

      - run: flutter pub get

      - name: Code prüfen
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          # Fehler direkt auf GitHub anzeigen (Reiter "Actions" -> Annotations)
          grep -E "^\s*error " analyze.txt | head -50 | while read -r line; do echo "::error::$line"; done
          exit $code

      - name: Tests
        run: flutter test

      - name: APK bauen
        if: env.HAS_FIREBASE == 'true'
        run: flutter build apk --release

      - name: APK hochladen
        if: env.HAS_FIREBASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-APK
          path: build/app/outputs/flutter-apk/app-release.apk
